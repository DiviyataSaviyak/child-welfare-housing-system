# The server's stack (OPS-2, SEC-1, SEC-3). It lives in /opt/diviyata, beside two env files:
#   .env          the server's settings and secrets, made by server-setup.sh (SEC-9)
#   release.env   APP_IMAGE and TOOLS_IMAGE of the running release, written by scripts/deploy.sh
# Always run it through scripts/lib.sh's `compose`, which passes both.
name: diviyata

x-app-env: &app-env
  APP_ENV: ${APP_ENV:?set APP_ENV in .env}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
  BETTER_AUTH_URL: https://${SITE_DOMAIN:?set SITE_DOMAIN in .env}
  FILES_DIR: /data/files
  TZ: Asia/Colombo

services:
  # Caddy gets and renews its Let's Encrypt certificate by itself, and sends HTTP to HTTPS.
  proxy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-${SITE_DOMAIN}}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/maintenance.html:/srv/maintenance.html:ro
      - caddy_data:/data
      - caddy_config:/config

  app:
    image: ${APP_IMAGE:-diviyata-app:not-deployed}
    restart: unless-stopped
    environment:
      <<: *app-env
      # diviyata_app can read and write rows, but can't change the schema or the audit rows (SEC-3).
      DATABASE_URL: postgresql://diviyata_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@db:5432/diviyata?schema=public
    volumes:
      - files:/data/files
    depends_on:
      db:
        condition: service_healthy

  # No published port: only the containers on this server reach it (SEC-3).
  db:
    image: postgres:17.10-alpine
    restart: unless-stopped
    shm_size: 256mb
    environment:
      # The owner, who runs the migrations, the seed and the grants.
      POSTGRES_USER: diviyata
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD in .env}
      POSTGRES_DB: diviyata
      TZ: Asia/Colombo
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diviyata -d diviyata"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Runs only when asked: `compose run --rm tools npx prisma migrate deploy`, and the scripts.
  tools:
    image: ${TOOLS_IMAGE:-diviyata-tools:not-deployed}
    profiles: ["tools"]
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://diviyata:${DB_OWNER_PASSWORD}@db:5432/diviyata?schema=public
    volumes:
      - files:/data/files
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
  files:
  caddy_data:
  caddy_config:
