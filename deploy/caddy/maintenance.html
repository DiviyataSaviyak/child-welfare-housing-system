    <title>දිවියට සවියක්</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;

  <body>
    <main>
      <p>පද්ධතිය යාවත්කාලීන වෙමින් පවතී. මිනිත්තු කිහිපයකින් නැවත උත්සාහ කරන්න.</p>
      <p lang="ta">அமைப்பு புதுப்பிக்கப்படுகிறது. சில நிமிடங்களில் மீண்டும் முயற்சிக்கவும்.</p>
      <p lang="en">The system is being updated. Please try again in a few minutes.</p>
    </main>
