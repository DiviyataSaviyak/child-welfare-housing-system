name: Release

# Every push to main that passes CI becomes a release (OPS-3, SEC-15):
#   1. ci.yml's checks
#   2. the app and tools images (docker/Dockerfile), each built for amd64 and arm64 on a runner of
#      that kind, then published to GitHub's container registry as one image per name, tagged with
#      the commit
#   3. a Trivy scan of both on both platforms: a HIGH or CRITICAL vulnerability with a fix stops the
#      release (.trivyignore lists accepted ones, each with its reason). An SBOM of each image too
#   4. both signed with the release key, which never leaves AWS KMS, and their SBOMs attached as
#      signed attestations
#   5. the Infrastructure repository's Promote workflow started with the commit and both digests: it
#      checks the signatures and deploys the release to staging
# Nothing is deployed from here. Steps 4 and 5 wait for the repository variables from the
# Infrastructure repository's bootstrap (its README, step 5), and for the GitHub App (step 8);
# until then a release stops after step 3, and the next push to main (or "Run workflow") makes a
# whole one.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One release at a time, and a running one is never cancelled halfway: a newer push waits, and
# replaces any older one still waiting.
concurrency:
  group: release
  cancel-in-progress: false

env:
  COSIGN_VERSION: v3.1.3
  COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71 # cosign-linux-amd64
  TRIVY_VERSION: 0.75.0
  TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f # trivy_0.75.0_Linux-64bit.tar.gz

jobs:
  ci:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build (${{ matrix.arch }})
    needs: ci
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # to push the images to GitHub's registry
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image names
        id: names
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/diviyata"
          echo "app=$prefix-app" >>"$GITHUB_OUTPUT"
          echo "tools=$prefix-tools" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only; the publish job tags them. Each image and platform has its own build cache.
      - name: The app image
        id: app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: app
          platforms: linux/${{ matrix.arch }}
          build-args: COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ steps.names.outputs.app }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=app-${{ matrix.arch }}
          cache-to: type=gha,scope=app-${{ matrix.arch }},mode=max

      - name: The tools image
        id: tools
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: tools
          platforms: linux/${{ matrix.arch }}
          build-args: COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ steps.names.outputs.tools }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=tools-${{ matrix.arch }}
          cache-to: type=gha,scope=tools-${{ matrix.arch }},mode=max

      - name: Record the two digests
        env:
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          TOOLS_DIGEST: ${{ steps.tools.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          echo "$APP_DIGEST" >"$RUNNER_TEMP/digests/app-$ARCH"
          echo "$TOOLS_DIGEST" >"$RUNNER_TEMP/digests/tools-$ARCH"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish both platforms under the commit
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write # to tag the images in GitHub's registry
    outputs:
      app: ${{ steps.publish.outputs.app }}
      tools: ${{ steps.publish.outputs.tools }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: One image per name, for amd64 and arm64
        id: publish
        env:
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          for name in app tools; do
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/diviyata-$name"
            docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.source=$SOURCE" \
              --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
              --tag "$image:$GITHUB_SHA" \
              "$image@$(cat "$RUNNER_TEMP/digests/$name-amd64")" \
              "$image@$(cat "$RUNNER_TEMP/digests/$name-arm64")"
            digest=$(docker buildx imagetools inspect "$image:$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)
            [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::$image:$GITHUB_SHA has no digest"; exit 1; }
            echo "$name=$digest" >>"$GITHUB_OUTPUT"
            echo "$image@$digest" >>"$GITHUB_STEP_SUMMARY"
          done

  scan:
    name: Scan for vulnerabilities, list the contents
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read # to read the images in GitHub's registry
    env:
      APP_DIGEST: ${{ needs.publish.outputs.app }}
      TOOLS_DIGEST: ${{ needs.publish.outputs.tools }}
    steps:
      # For .trivyignore, which Trivy reads from the working folder.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy, checked against its release's checksum
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v$TRIVY_VERSION/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "$TRIVY_SHA256  trivy.tar.gz" | sha256sum --check --strict
          mkdir -p bin && tar -xzf trivy.tar.gz -C bin trivy
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"

      - name: No HIGH or CRITICAL vulnerability that has a fix, on either platform
        run: |
          for name in app tools; do
            digest_var="${name^^}_DIGEST"
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/diviyata-$name@${!digest_var}"
            for platform in linux/amd64 linux/arm64; do
              echo "::group::$name, $platform"
              trivy image --no-progress --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
                --exit-code 1 --platform "$platform" "$image"
              echo "::endgroup::"
            done
          done

      - name: The SBOMs (CycloneDX, for arm64, the servers' platform)
        run: |
          mkdir -p "$RUNNER_TEMP/sbom"
          for name in app tools; do
            digest_var="${name^^}_DIGEST"
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/diviyata-$name@${!digest_var}"
            trivy image --quiet --platform linux/arm64 --format cyclonedx --output "$RUNNER_TEMP/sbom/$name.cdx.json" "$image"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom/
          if-no-files-found: error
          retention-days: 90

  sign:
    name: Sign with the release key
    needs: [publish, scan]
    # Once the release's variables are set (the Infrastructure repository's README, step 5).
    if: vars.AWS_RELEASE_ROLE != '' && vars.COSIGN_KEY != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write # to sign in to AWS as the release role (OIDC), which may only use the signing key
      packages: write # to store the signatures and attestations beside the images
    env:
      APP_DIGEST: ${{ needs.publish.outputs.app }}
      TOOLS_DIGEST: ${{ needs.publish.outputs.tools }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE }}
          aws-region: ${{ vars.AWS_RELEASE_REGION }}

      - name: cosign, checked against its release's checksum
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo cosign "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-linux-amd64"
          echo "$COSIGN_SHA256  cosign" | sha256sum --check --strict
          mkdir -p bin && install -m 0755 cosign bin/cosign
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"

      # Not on Sigstore's public transparency log, which would publish the images' names: the
      # Infrastructure repository checks the signatures with the key alone (releases/cosign.pub).
      - name: Sign both images, and attach their SBOMs as signed attestations
        env:
          COSIGN_KEY: ${{ vars.COSIGN_KEY }}
        run: |
          for name in app tools; do
            digest_var="${name^^}_DIGEST"
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/diviyata-$name@${!digest_var}"
            cosign sign --yes --key "$COSIGN_KEY" --use-signing-config=false --tlog-upload=false "$image"
            cosign attest --yes --key "$COSIGN_KEY" --use-signing-config=false --tlog-upload=false \
              --type cyclonedx --predicate "$RUNNER_TEMP/sbom/$name.cdx.json" "$image"
          done

  promote:
    name: Start the promotion in the Infrastructure repository
    needs: [publish, sign]
    # Once the GitHub App that may start it exists (the Infrastructure repository's README, step 8).
    if: vars.PROMOTE_APP_CLIENT_ID != '' && vars.INFRASTRUCTURE_REPOSITORY != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: The Infrastructure repository
        id: target
        env:
          INFRASTRUCTURE_REPOSITORY: ${{ vars.INFRASTRUCTURE_REPOSITORY }}
        run: |
          [[ $INFRASTRUCTURE_REPOSITORY =~ ^([A-Za-z0-9-]+)/([A-Za-z0-9._-]+)$ ]] ||
            { echo "::error::INFRASTRUCTURE_REPOSITORY must be <owner>/<name>"; exit 1; }
          echo "owner=${BASH_REMATCH[1]}" >>"$GITHUB_OUTPUT"
          echo "name=${BASH_REMATCH[2]}" >>"$GITHUB_OUTPUT"

      # A token for that repository alone, which may start its workflows and do nothing else.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: token
        with:
          client-id: ${{ vars.PROMOTE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROMOTE_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}
          permission-actions: write

      # maintenance=false: the deploy stops the app by itself for a migration with a maintenance note
      # (CLAUDE.md, "Migrations without downtime").
      - name: Start Promote
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          INFRASTRUCTURE_REPOSITORY: ${{ vars.INFRASTRUCTURE_REPOSITORY }}
          APP_DIGEST: ${{ needs.publish.outputs.app }}
          TOOLS_DIGEST: ${{ needs.publish.outputs.tools }}
        run: |
          gh workflow run promote.yml --repo "$INFRASTRUCTURE_REPOSITORY" --ref main \
            -f commit="$GITHUB_SHA" -f app="$APP_DIGEST" -f tools="$TOOLS_DIGEST" -f maintenance=false
          echo "Promote started in $INFRASTRUCTURE_REPOSITORY for $GITHUB_SHA" >>"$GITHUB_STEP_SUMMARY"
