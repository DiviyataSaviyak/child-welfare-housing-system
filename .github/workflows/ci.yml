name: CI

# Runs on pull requests to main, not on pushes to other branches. Pushes to main run these checks
# through release.yml, which publishes the images only when they pass. The server's files are checked
# in the Infrastructure repository.
on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: actionlint on the workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: diviyata
          POSTGRES_PASSWORD: diviyata_ci
          POSTGRES_DB: diviyata_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diviyata -d diviyata_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # One throwaway database. The end-to-end tests use its "e2e" schema; the database tests
      # create and drop a schema of their own for each run.
      DATABASE_URL: postgresql://diviyata:diviyata_ci@localhost:5432/diviyata_test?schema=e2e
      TEST_DATABASE_URL: postgresql://diviyata:diviyata_ci@localhost:5432/diviyata_test?schema=public
      APP_ENV: ci
      # Used only by this CI run's throwaway database; never used anywhere else.
      BETTER_AUTH_SECRET: ci-only-secret-for-the-throwaway-test-database-0000
      BETTER_AUTH_URL: http://localhost:3100

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: No hard-coded screen text (UI-1)
        run: npm run check:strings

      - name: Unit tests
        run: npm test

      - name: Database tests
        run: npm run test:db

      - name: Build
        run: npm run build

      - name: Prepare the end-to-end database
        run: |
          npx prisma migrate deploy
          npx prisma db seed

      - name: End-to-end tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Dependency audit (SEC-12)
        run: npm audit --omit=dev --audit-level=high
