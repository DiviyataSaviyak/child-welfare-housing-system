name: Deploy

# OPS-3: every push to main that passes CI reaches the server with no manual step.
# 1. ci.yml's checks.  2. The two images, pushed to GitHub's container registry, tagged with the
# commit.  3. The server's files copied over SSH, and deploy/server/scripts/deploy.sh run there.
#
# Settings (docs/RUNBOOK.md, "GitHub"). A repository variable, because the deploy job's "if" is read
# before the job enters its environment, when the environment's variables aren't visible yet:
#   variable DEPLOY_HOST          the server's domain name or Elastic IP
# and in the "production" environment:
#   secret   DEPLOY_SSH_KEY       the deploy user's private key, from server-setup.sh
#   secret   DEPLOY_KNOWN_HOSTS   the server's host key line, from server-setup.sh
# Until DEPLOY_HOST is set, the images are built and pushed but nothing is deployed.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, in order; a running deploy is never cancelled halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      app: ${{ steps.names.outputs.app }}
      tools: ${{ steps.names.outputs.tools }}
    steps:
      - uses: actions/checkout@v4

      - name: Image names
        id: names
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/diviyata"
          echo "app=$prefix-app:$GITHUB_SHA" >>"$GITHUB_OUTPUT"
          echo "tools=$prefix-tools:$GITHUB_SHA" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: The app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: app
          build-args: COMMIT=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: ${{ steps.names.outputs.app }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The tools image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: tools
          build-args: COMMIT=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: ${{ steps.names.outputs.tools }}
          push: true
          cache-from: type=gha

  deploy:
    needs: images
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      HOST: ${{ vars.DEPLOY_HOST }}
      APP_IMAGE: ${{ needs.images.outputs.app }}
      TOOLS_IMAGE: ${{ needs.images.outputs.tools }}
    steps:
      - uses: actions/checkout@v4

      - name: SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" >~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy ~/.ssh/known_hosts
          printf 'Host server\n  HostName %s\n  User deploy\n  IdentityFile ~/.ssh/deploy\n  IdentitiesOnly yes\n' "$HOST" >~/.ssh/config

      # The stack's files only; .env, release.env and the backups on the server are never touched.
      - name: Copy the server files
        run: |
          rsync -rlt --chmod=D750,F640 deploy/server/compose.yml deploy/server/caddy deploy/server/scripts server:/opt/diviyata/
          ssh server 'chmod 750 /opt/diviyata/scripts/*.sh'

      # The server pulls with this job's own token, which expires when the job ends.
      - name: Deploy
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        # The names are filled in here, on purpose (ShellCheck SC2029).
        run: |
          # shellcheck disable=SC2029
          printf '%s' "$TOKEN" | ssh server "docker login ghcr.io -u '$ACTOR' --password-stdin >/dev/null"
          status=0
          # shellcheck disable=SC2029
          ssh server "/opt/diviyata/scripts/deploy.sh '$APP_IMAGE' '$TOOLS_IMAGE'" || status=$?
          ssh server 'docker logout ghcr.io >/dev/null' || true
          exit "$status"
